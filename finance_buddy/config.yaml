name: "Finance Buddy"
slug: "finance_buddy"
description: "Domowy budżet: konta, koperty, paragony z OCR, import z YNAB i CSV z banku."
version: "0.1.30"
url: "https://github.com/czajakamil/ha-addons/tree/main/finance_buddy"
init: false

arch:
  - aarch64
  - amd64

startup: application
boot: auto

# Dostęp wyłącznie przez Ingress, celowo bez `ports`: aplikacja ufa logowaniu HA
# (patrz DOCS.md), więc nie może mieć żadnej innej drogi wejścia.
ingress: true
ingress_port: 8099
panel_icon: "mdi:wallet-outline"
panel_title: "Finance Buddy"

map:
  - share:rw

# Kopie aplikacji są w /share, nie w /data, ale gdyby ktoś ustawił je w /data,
# nie powinny pęcznieć w każdej kopii HA.
backup_exclude:
  - "backups/*"

options:
  username: "dev"
  ynab_api_key: ""
  backup_dir: "/share/finance_buddy/backups"
  receipt_extractor: "rapidocr"
  log_level: "INFO"

schema:
  username: str
  ynab_api_key: password
  backup_dir: str
  receipt_extractor: list(rapidocr|tesseract)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
