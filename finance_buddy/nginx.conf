server {
    listen 8099;
    server_name _;

    # Tylko brama Ingress Home Assistanta. Inne aplikacje siedzą w tej samej sieci
    # Dockera, a logowanie w apce ufa temu, że HA już sprawdził użytkownika.
    allow 172.30.32.2;
    deny all;

    root /usr/share/nginx/html;
    index index.html;

    # Największy upload to wielostronicowy PDF z paragonami (FINANCE_MAX_UPLOAD_MB).
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /__api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # OCR paczki paragonów potrafi trwać minuty.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA. <base> z prefiksem Ingressu sprawia, że względne assety i API
    # działają też po odświeżeniu głębokiego adresu (/transactions/123).
    location / {
        add_header Cache-Control "no-cache";
        sub_filter_once on;
        sub_filter '<head>' '<head><base href="$http_x_ingress_path/">';
        try_files $uri $uri/ /index.html;
    }
}
