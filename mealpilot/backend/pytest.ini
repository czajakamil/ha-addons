[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q -ra
markers =
    smoke: minimalny zestaw blokujący release (musi przejść przed tagiem)
    integration: testy E2E przez HTTP (TestClient)
    unit: testy jednostkowe modułów backendu
filterwarnings =
    ignore::DeprecationWarning
