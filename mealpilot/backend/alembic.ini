# Konfiguracja Alembica **wyłącznie dla CLI dewelopera** (np.
# `alembic revision --autogenerate -m "..."`).
#
# Runtime add-onu NIE czyta tego pliku: `app/migrator.py` buduje
# `alembic.config.Config` w kodzie, bo Dockerfile kopiuje do obrazu tylko
# `backend/app`, `backend/mcp_server.py` i `backend/scripts` — alembic.ini nigdy
# tam nie trafia. Katalog migracji leży więc w `app/migrations/`, żeby jechał
# razem z pakietem `app`.
#
# URL bazy celowo nie jest tu ustawiony: env.py bierze go z `app.db` (czyli ze
# zmiennej MEALPILOT_DB), żeby CLI i aplikacja zawsze celowały w to samo miejsce.
[alembic]
script_location = app/migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
