[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["env", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF", "N"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic, not a bug
    "RUF001", # Polish text uses proper typographic dashes/quotes
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N"]
# Domain errors are named after the condition (NotFound, Forbidden), matching how
# they read at the call site and how each transport maps them.
"app/services/errors.py" = ["N818"]
